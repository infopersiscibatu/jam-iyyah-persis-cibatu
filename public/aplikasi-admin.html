<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Pembuatan paket aplikasi admin — PC PERSIS Cibatu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e4b2b">
  <meta name="robots" content="noindex">
  <!--
    Halaman pembantu, bukan bagian dari situs.

    Fungsinya satu saja: menjadi alamat yang dimasukkan ke PWABuilder sehingga
    PWABuilder membaca /manifest-admin.json (yang memuat keempat pintasan unit),
    bukan /manifest.json milik aplikasi jamaah.

    Halaman ini tidak ditautkan dari mana pun di situs.
  -->
  <link rel="manifest" href="/manifest-admin.json">
  <link rel="apple-touch-icon" href="/ikon-admin-apple-180.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0e4b2b; color: #fff; padding: 24px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .kartu {
      width: 100%; max-width: 360px; background: #fff; color: #14231c;
      border-radius: 20px; padding: 24px; text-align: center;
      box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.5);
    }
    img { width: 96px; height: 96px; }
    h1 { font-size: 16px; margin: 14px 0 6px; }
    p { font-size: 13px; line-height: 1.6; color: #55665c; margin: 0 0 16px; }
    a {
      display: inline-block; background: #0e4b2b; color: #fff; text-decoration: none;
      font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="kartu">
    <img src="/ikon-admin-512.png" alt="Ikon aplikasi admin">
    <h1>Halaman pembantu pembuatan paket</h1>
    <p>
      Alamat ini dipakai hanya untuk membuat paket aplikasi admin di PWABuilder.
      Yang dibaca dari sini adalah berkas <b>manifest-admin.json</b> beserta keempat
      pintasan unit di dalamnya.
    </p>
    <a href="/#/admin">Buka panel admin</a>
  </div>

  <script>
    /* Bila halaman ini sampai terbuka sebagai aplikasi terpasang, langsung ke panel admin. */
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) {
        location.replace("/#/admin");
      }
    } catch (e) {}

    /* Service worker situs didaftarkan agar PWABuilder menilai halaman ini sebagai PWA. */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
    }
  </script>
</body>
</html>
